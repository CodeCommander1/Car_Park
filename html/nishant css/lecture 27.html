<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container
        {
            width: 100vw;
            height: 100vh;
            background: rgb(2,0,36);
            background: linear-gradient(90deg, rgba(2,0,36,1) 0%, rgba(9,9,121,1) 0%, rgba(34,205,239,1) 0%);
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .cards{
            width: 230px;
            height: 370px;
            background-color: rgb(226, 230, 234);
            border-radius: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 15px;
            
        }

        .cards img{
            height: 40%;
            border-radius: 10px;

        }

        .cards h3{
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>

</head>
<body>
    <div class="container">

        <div class="cards">
            <img src="lec27.png" alt="">
            <h3>Improve your Frontend Skills by develoving projects</h2>
                <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Cumque esse magnam sint exercitationem vel atque. Aspernatur, incidunt temporibus.`</p>


        </div>

    </div>
    
</body>
</html>
