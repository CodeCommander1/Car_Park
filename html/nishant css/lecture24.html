<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition ka gyan</title>
</head>
<style>
    .box
    {
        height: 300px;
        width: 300px;
        background-color: beige;
        border: 1px solid black;
        transition-property: all;        /* we can choose width or height insted if all */
        transition-duration: 4s;
        transition-delay: 1s;
        transition-timing-function: ease-in;
        /* shorthand notation */
        /* transition: all 2s ease-in 5s; */
        transition: width 2s,height 5s;

    }
  

    .box:hover{
        width: 1200px;
        height: 450px;
        background-color: aqua;

    }
</style>
<body>
    <div class="box">
        <h2>Place mouse to see transition</h2>
    </div>
</body>
</html>
