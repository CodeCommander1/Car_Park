<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .container
        {
            width: 100vw;
            height: 100vh;
            background: rgb(93,124,130);
            background: linear-gradient(90deg, rgba(93,124,130,1) 0%, rgba(180,180,183,1) 0%);
           

            display: flex;
            justify-content: center;
            align-items: center;

        }
        .cards{
            height: 415px;
            width: 300px;
            background-color: white;
            border-radius: 20px;
            gap: 15px;

            display: flex;
            flex-direction: column;
            align-items: center;

        }
        .cards img{
            width: 100%;
            height: 30%;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;

        }
        .cards p{
            margin: 15px;
        }
        .textBox{
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 75%;
        }
        .amountBox
        {
            height: 10%;
            width: 85%;
            border-radius: 10px;
            
            background-color: rgba(136, 219, 219, 0.989);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-right: 10px;
            padding-left: 10px;


        }

        #leftbox{
            height: 100%;
            display: flex;
            gap: 5px;
            align-items: center;


        }
        #imgbox img{
            height: 100%;
            width: 2rem;
            border-radius: 0%;

        }

        #rightbox p{
            padding: 5px;

        }

        .amountBox  p{
            gap: 1px;
        }
        

        #payment{
            height: 9%;
            width: 80%;
            border-radius: 10px;
            color: white;
            background-color: rgba(0, 0, 255, 0.676);
            box-shadow: 2px 2px 4px #000000;

        }
        a{
            text-decoration: none;
            color: rgb(72, 68, 68);
            font-weight: bold;
            font-size: large;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cards">
            <img src="part2.jpg" alt="">
            <div class="textBox">
            <h3>Order Summary</h3>
            <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Labore corporis quas ullam eaque ab quidem!</p>


            </div>

            <div class="amountBox">
                <div id="leftbox">

                    <div id="imgbox">
                        <img src="lec27.png" alt="">
                    </div>

                    <div id="textamount">
                        <p>Amount</p>
                        <p>$99.9/Year</p>
                    </div>
                </div>

                <div id="rightbox">
                    <a href="#">Change</a>

                </div>
        
            </div>

            <button id="payment">
                Proceed to Payment
            </button>

            <a href="#">Cancel Order</a>

    
        </div>
    </div>
    
</body>
</html>
